# Cloudflare Workers Free routing gateway for M2. Implemented locally, not deployed.
# Operation, privacy and release gates: docs/m2-operations.md#cloudflare-gateway.
name = "mem-ed-wait-times"
main = "src/index.mjs"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

[vars]
ASSET_ORIGIN = "https://mem-ed-wait-times-dashboard.s3.us-east-1.amazonaws.com"
TOMTOM_REQUEST_BUDGET = "20000"

[[durable_objects.bindings]]
name = "ROUTE_GATE"
class_name = "RouteGate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RouteGate"]

# No Workers Logs or traces: route requests carry user origins and must not be retained.
[observability]
enabled = false
