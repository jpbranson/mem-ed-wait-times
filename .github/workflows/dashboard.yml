name: Render dashboard

on:
  # Hourly runs come from AWS EventBridge rule dashboard_hourly at minute 17, which
  # alarms by email on failed dispatches. GitHub's cron backup was removed 2026-09-27.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-production
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: quarto-dev/quarto-actions/setup@v2

      - run: pip install -r requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: python -m unittest discover -s tests -v

      - run: node --test tests/*.test.mjs

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - run: python -m edwait.prepare

      - run: quarto render dashboard/ --to html

      - run: aws s3 sync dashboard/_site/ s3://mem-ed-wait-times-dashboard/ --delete --exclude "data/*"

      - name: Verify public freshness and client contracts
        run: node scripts/check_public.mjs --expected-site dashboard/_site
